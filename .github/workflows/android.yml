# Builds the Android app (APK) every time main changes, and puts it on the
# "Android app" release so it can be downloaded straight to a phone.
name: Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Make the Android project
        run: |
          npm run copy-web
          npx cap add android
          npx cap sync android
          cp android-src/com/musicalwits/app/*.java android/app/src/main/java/com/musicalwits/app/

      # The icon sizes are kept ready-made in android-src/res, so the build needs no extra tools.
      - name: Use the Musical Wits icon
        run: |
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.webp
          cp -r android-src/res/. android/app/src/main/res/
          sed -i 's/>#[0-9A-Fa-f]*</>#0B0D1A</' android/app/src/main/res/values/ic_launcher_background.xml || true

      # Every build is signed with the same key, so a new app installs over the old one
      # and keeps its songs. Without this each build gets a different key and Android refuses the update.
      - name: Use the same signing key every time
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../android-src/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MusicalWits.apk

      - name: Check the app carries the shared signing key
        run: |
          want=$(keytool -list -keystore android-src/debug.keystore -storepass android | grep -o 'SHA-256): .*' | cut -d' ' -f2)
          got=$(keytool -printcert -jarfile MusicalWits.apk | grep 'SHA256:' | head -1 | awk '{print $2}')
          echo "wanted $want"; echo "got    $got"
          test -n "$want" && test "$want" = "$got"

      - name: Keep the APK with this build run
        uses: actions/upload-artifact@v4
        with:
          name: MusicalWits-apk
          path: MusicalWits.apk

      - name: Publish it on the "Android app" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MusicalWits.apk \
            --title "Android app (latest)" \
            --notes "Download MusicalWits.apk on your Android phone and open it to install. Built from ${GITHUB_SHA::7}." \
            --latest
