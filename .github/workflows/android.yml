# Builds the Android app (APK) every time main changes, and puts it on the
# "Android app" release so it can be downloaded straight to a phone.
name: Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Make the Android project
        run: |
          npm run copy-web
          npx cap add android
          npx cap sync android

      - name: Use the Musical Wits icon
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            dir=android/app/src/main/res/mipmap-$name
            rm -f $dir/ic_launcher*.webp
            convert icons/icon-512.png -resize ${size}x${size} $dir/ic_launcher.png
            convert icons/icon-512.png -resize ${size}x${size} $dir/ic_launcher_round.png
            convert icons/icon-maskable-512.png -resize $((size * 9 / 4))x$((size * 9 / 4)) $dir/ic_launcher_foreground.png
          done
          sed -i 's/>#[0-9A-Fa-f]*</>#0B0D1A</' android/app/src/main/res/values/ic_launcher_background.xml || true

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MusicalWits.apk

      - name: Keep the APK with this build run
        uses: actions/upload-artifact@v4
        with:
          name: MusicalWits-apk
          path: MusicalWits.apk

      - name: Publish it on the "Android app" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MusicalWits.apk \
            --title "Android app (latest)" \
            --notes "Download MusicalWits.apk on your Android phone and open it to install. Built from ${GITHUB_SHA::7}." \
            --latest
